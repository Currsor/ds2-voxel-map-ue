<svg xmlns="http://www.w3.org/2000/svg" width="700" height="600" viewBox="62 150 700 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172238" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#101827" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.44"/>
    </linearGradient>
    <linearGradient id="cubeFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0284c7" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#0369a1" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="cubeSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#075985" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#0c4a6e" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="glowAmber" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22d3ee"/>
    </marker>
    <style>
      .title { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-weight: 700; fill: #f8fafc; }
      .label { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-weight: 600; fill: #e2e8f0; }
      .body { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #94a3b8; }
      .mono { font-family: Consolas, "SFMono-Regular", monospace; fill: #cbd5e1; }
      .cyan { fill: #22d3ee; }
      .amber { fill: #fbbf24; }
      .green { fill: #4ade80; }
      .red { fill: #fb7185; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <circle cx="1300" cy="110" r="230" fill="#0ea5e9" opacity="0.05"/>
  <circle cx="90" cy="840" r="250" fill="#8b5cf6" opacity="0.04"/>

  <text x="72" y="78" class="title" font-size="34">Step 2 · Ray–Box 求交：确定体素块内的有效射线段</text>
  <text x="72" y="112" class="body" font-size="17">对 X / Y / Z 三组平行平面分别求交，再取三个区间的交集</text>

  <rect x="62" y="150" width="700" height="600" rx="22" fill="url(#panel)" stroke="#334155" stroke-width="1.5"/>
  <rect x="790" y="150" width="588" height="600" rx="22" fill="url(#panel)" stroke="#334155" stroke-width="1.5"/>

  <circle cx="94" cy="190" r="14" fill="#22d3ee" opacity="0.16"/>
  <text x="94" y="196" class="label cyan" font-size="15" text-anchor="middle">1</text>
  <text x="120" y="197" class="title" font-size="22">射线穿过 Block AABB</text>
  <text x="716" y="197" class="mono" font-size="14" text-anchor="end">World / Block Local</text>

  <g opacity="0.75">
    <path d="M155 620 H690" stroke="#334155" stroke-width="1"/>
    <path d="M185 255 V680" stroke="#334155" stroke-width="1"/>
    <path d="M150 655 L650 270" stroke="#26364c" stroke-width="1"/>
  </g>

  <g>
    <polygon points="364,330 540,274 660,360 480,420" fill="url(#cubeTop)" stroke="#7dd3fc" stroke-width="2"/>
    <polygon points="364,330 480,420 480,615 364,520" fill="url(#cubeFront)" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="480,420 660,360 660,550 480,615" fill="url(#cubeSide)" stroke="#0ea5e9" stroke-width="2"/>
    <path d="M540 274 L540 465 M540 465 L660 550 M540 465 L364 520" fill="none" stroke="#38bdf8" stroke-width="1.3" stroke-dasharray="7 6" opacity="0.65"/>
    <text x="525" y="470" class="title" font-size="21" text-anchor="middle">Block AABB</text>
    <text x="525" y="495" class="mono" font-size="13" text-anchor="middle">min=(0,0,0)</text>
    <text x="525" y="515" class="mono" font-size="13" text-anchor="middle">max=(4,3,2)</text>
  </g>

  <path d="M122 565 L704 355" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrowAmber)" filter="url(#glowAmber)"/>
  <path d="M365 477 L660 371" fill="none" stroke="#4ade80" stroke-width="7" stroke-linecap="round" opacity="0.92" filter="url(#glowGreen)"/>

  <circle cx="122" cy="565" r="7" fill="#fbbf24"/>
  <text x="100" y="594" class="label amber" font-size="15">O</text>
  <text x="84" y="616" class="mono" font-size="13">(-2,1,1)</text>

  <circle cx="365" cy="477" r="9" fill="#4ade80" stroke="#dcfce7" stroke-width="2"/>
  <circle cx="660" cy="371" r="9" fill="#fb7185" stroke="#ffe4e6" stroke-width="2"/>

  <path d="M365 477 L306 420" fill="none" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="171" y="363" width="151" height="61" rx="9" fill="#052e1a" stroke="#166534"/>
  <text x="188" y="388" class="label green" font-size="15">入点 Pentry</text>
  <text x="188" y="410" class="mono" font-size="13">t = 2</text>

  <path d="M660 371 L692 302" fill="none" stroke="#fb7185" stroke-width="1.5"/>
  <rect x="602" y="244" width="128" height="61" rx="9" fill="#3f0d18" stroke="#9f1239"/>
  <text x="619" y="269" class="label red" font-size="15">出点 Pexit</text>
  <text x="619" y="291" class="mono" font-size="13">t = 6</text>

  <rect x="100" y="650" width="624" height="66" rx="11" fill="#0f172a" stroke="#334155"/>
  <text x="124" y="677" class="mono" font-size="15">r(t) = O + tD</text>
  <text x="302" y="677" class="mono" font-size="15">O=(-2,1,1)</text>
  <text x="493" y="677" class="mono" font-size="15">D=(1,0.25,0.125)</text>
  <text x="124" y="700" class="body" font-size="14">绿色线段就是后续 DDA 允许步进的范围：t ∈ [2, 6]</text>

  <circle cx="822" cy="190" r="14" fill="#22d3ee" opacity="0.16"/>
  <text x="822" y="196" class="label cyan" font-size="15" text-anchor="middle">2</text>
  <text x="848" y="197" class="title" font-size="22">Slab 区间合并</text>
  <text x="1332" y="197" class="mono" font-size="14" text-anchor="end">t interval</text>

  <g>
    <text x="840" y="255" class="label" font-size="15">X slab</text>
    <text x="840" y="277" class="mono" font-size="13">x ∈ [0,4]</text>
    <line x1="975" y1="265" x2="1310" y2="265" stroke="#475569" stroke-width="2"/>
    <rect x="1059" y="254" width="167" height="22" rx="11" fill="#22d3ee" opacity="0.27" stroke="#22d3ee"/>
    <text x="1059" y="297" class="mono cyan" font-size="13" text-anchor="middle">2</text>
    <text x="1226" y="297" class="mono cyan" font-size="13" text-anchor="middle">6</text>
    <text x="1270" y="270" class="mono" font-size="13">[2,6]</text>

    <text x="840" y="345" class="label" font-size="15">Y slab</text>
    <text x="840" y="367" class="mono" font-size="13">y ∈ [0,3]</text>
    <line x1="975" y1="355" x2="1310" y2="355" stroke="#475569" stroke-width="2"/>
    <rect x="975" y="344" width="335" height="22" rx="11" fill="#a78bfa" opacity="0.25" stroke="#a78bfa"/>
    <text x="975" y="387" class="mono" font-size="13" text-anchor="middle">-4</text>
    <text x="1310" y="387" class="mono" font-size="13" text-anchor="middle">8</text>
    <text x="1270" y="360" class="mono" font-size="13">[-4,8]</text>

    <text x="840" y="435" class="label" font-size="15">Z slab</text>
    <text x="840" y="457" class="mono" font-size="13">z ∈ [0,2]</text>
    <line x1="975" y1="445" x2="1310" y2="445" stroke="#475569" stroke-width="2"/>
    <rect x="975" y="434" width="335" height="22" rx="11" fill="#fb7185" opacity="0.22" stroke="#fb7185"/>
    <text x="975" y="477" class="mono" font-size="13" text-anchor="middle">-8</text>
    <text x="1310" y="477" class="mono" font-size="13" text-anchor="middle">8</text>
    <text x="1270" y="450" class="mono" font-size="13">[-8,8]</text>
  </g>

  <path d="M844 512 H1322" stroke="#334155" stroke-width="1" stroke-dasharray="5 5"/>

  <g>
    <text x="840" y="552" class="label green" font-size="17">取交集</text>
    <text x="840" y="581" class="mono" font-size="15">tEntry = max(2, -4, -8) = 2</text>
    <text x="840" y="610" class="mono" font-size="15">tExit  = min(6,  8,  8) = 6</text>

    <rect x="840" y="638" width="492" height="73" rx="12" fill="#052e1a" stroke="#15803d" stroke-width="1.5"/>
    <circle cx="868" cy="674" r="9" fill="#4ade80"/>
    <text x="892" y="669" class="label green" font-size="16">命中条件成立</text>
    <text x="892" y="694" class="mono" font-size="14">tEntry ≤ tExit  且  tExit ≥ 0</text>
  </g>

  <rect x="62" y="786" width="1316" height="70" rx="15" fill="#0c1628" stroke="#1e3a5f"/>
  <circle cx="96" cy="821" r="9" fill="#4ade80"/>
  <text x="120" y="817" class="label" font-size="16">输出给下一步</text>
  <text x="120" y="840" class="body" font-size="15">射线进入 Block 的位置 Pentry=(0,1.5,1.25)，从 t=2 开始 DDA，并且最晚在 t=6 离开 Block。</text>

  <g transform="translate(1135 808)">
    <line x1="0" y1="9" x2="24" y2="9" stroke="#fbbf24" stroke-width="3"/>
    <text x="34" y="14" class="body" font-size="13">Ray</text>
    <line x1="88" y1="9" x2="112" y2="9" stroke="#4ade80" stroke-width="6" stroke-linecap="round"/>
    <text x="122" y="14" class="body" font-size="13">有效段</text>
  </g>
</svg>