<svg xmlns="http://www.w3.org/2000/svg" width="672" height="590" viewBox="62 148 672 590">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172238" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#101827" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="voxelTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity="0.70"/>
    </linearGradient>
    <linearGradient id="voxelSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#be123c" stop-opacity="0.76"/>
      <stop offset="1" stop-color="#881337" stop-opacity="0.60"/>
    </linearGradient>
    <filter id="glowAmber" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4ade80"/>
    </marker>
    <style>
      .title { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-weight: 700; fill: #f8fafc; }
      .label { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-weight: 600; fill: #e2e8f0; }
      .body { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #94a3b8; }
      .mono { font-family: Consolas, "SFMono-Regular", monospace; fill: #cbd5e1; }
      .cyan { fill: #22d3ee; }
      .amber { fill: #fbbf24; }
      .green { fill: #4ade80; }
      .red { fill: #fb7185; }
      .violet { fill: #a78bfa; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <circle cx="1310" cy="100" r="230" fill="#0ea5e9" opacity="0.05"/>
  <circle cx="80" cy="850" r="260" fill="#8b5cf6" opacity="0.04"/>

  <text x="72" y="76" class="title" font-size="34">Step 4 · HitT 与 Depth：把体素命中写回真实屏幕深度</text>
  <text x="72" y="111" class="body" font-size="17">HitT 是射线参数，不是深度值；先重建命中位置，再投影到裁剪空间得到 Pixel Depth</text>

  <rect x="62" y="148" width="672" height="590" rx="22" fill="url(#panel)" stroke="#334155" stroke-width="1.5"/>
  <rect x="762" y="148" width="616" height="590" rx="22" fill="url(#panel)" stroke="#334155" stroke-width="1.5"/>

  <circle cx="94" cy="188" r="14" fill="#22d3ee" opacity="0.16"/>
  <text x="94" y="194" class="label cyan" font-size="15" text-anchor="middle">1</text>
  <text x="120" y="195" class="title" font-size="22">DDA 返回 HitT，重建命中点</text>
  <text x="690" y="195" class="mono" font-size="14" text-anchor="end">World / Block Local</text>

  <!-- camera -->
  <g transform="translate(126 475)">
    <path d="M0 0 L42 -27 L42 27 Z" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
    <rect x="-21" y="-23" width="24" height="46" rx="6" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="-9" cy="0" r="6" fill="#60a5fa"/>
    <text x="-20" y="58" class="label" font-size="14">Camera O</text>
  </g>

  <!-- billboard plane -->
  <g>
    <polygon points="294,262 385,230 385,581 294,613" fill="#22d3ee" opacity="0.08" stroke="#22d3ee" stroke-width="2"/>
    <path d="M339 246 V597 M294 438 L385 406" stroke="#22d3ee" stroke-width="1" opacity="0.45"/>
    <text x="338" y="638" class="label cyan" font-size="14" text-anchor="middle">Billboard 画布</text>
    <text x="338" y="658" class="body" font-size="12" text-anchor="middle">仅负责产生像素</text>
  </g>

  <!-- target voxel -->
  <g stroke="#fb7185" stroke-width="2">
    <polygon points="520,333 602,304 660,347 576,377" fill="url(#voxelTop)"/>
    <polygon points="520,333 576,377 576,472 520,427" fill="url(#voxelSide)"/>
    <polygon points="576,377 660,347 660,441 576,472" fill="#9f1239" opacity="0.76"/>
    <path d="M602 304 V399 M602 399 L660 441 M602 399 L520 427" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="7 6" opacity="0.58"/>
  </g>
  <text x="590" y="395" class="title" font-size="15" text-anchor="middle">HIT VOXEL</text>
  <text x="590" y="415" class="mono" font-size="12" text-anchor="middle">cell (3,2,1)</text>

  <!-- ray -->
  <path d="M168 475 L691 316" fill="none" stroke="#fbbf24" stroke-width="2.8" marker-end="url(#arrowAmber)" filter="url(#glowAmber)"/>
  <circle cx="357" cy="418" r="7" fill="#22d3ee" stroke="#cffafe" stroke-width="2"/>
  <circle cx="558" cy="357" r="10" fill="#4ade80" stroke="#dcfce7" stroke-width="2" filter="url(#glowGreen)"/>
  <path d="M558 357 L493 273" stroke="#4ade80" stroke-width="1.5"/>

  <rect x="398" y="226" width="195" height="69" rx="10" fill="#052e1a" stroke="#15803d"/>
  <text x="416" y="251" class="label green" font-size="16">DDA 命中</text>
  <text x="416" y="277" class="mono" font-size="15">HitT = 5</text>

  <path d="M170 542 H558" stroke="#475569" stroke-width="2"/>
  <line x1="170" y1="531" x2="170" y2="553" stroke="#94a3b8" stroke-width="2"/>
  <line x1="357" y1="531" x2="357" y2="553" stroke="#22d3ee" stroke-width="2"/>
  <line x1="558" y1="531" x2="558" y2="553" stroke="#4ade80" stroke-width="2"/>
  <text x="170" y="575" class="mono" font-size="12" text-anchor="middle">t=0</text>
  <text x="357" y="575" class="mono cyan" font-size="12" text-anchor="middle">plane t</text>
  <text x="558" y="575" class="mono green" font-size="12" text-anchor="middle">HitT=5</text>

  <rect x="102" y="674" width="592" height="44" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="123" y="701" class="mono" font-size="15">P<tspan baseline-shift="sub" font-size="11">hit</tspan> = O + HitT · D</text>
  <text x="374" y="701" class="body" font-size="14">沿同一条像素射线定位真实表面</text>

  <circle cx="794" cy="188" r="14" fill="#22d3ee" opacity="0.16"/>
  <text x="794" y="194" class="label cyan" font-size="15" text-anchor="middle">2</text>
  <text x="820" y="195" class="title" font-size="22">命中点投影为 Depth</text>
  <text x="1334" y="195" class="mono" font-size="14" text-anchor="end">UE / Reverse-Z</text>

  <!-- transform pipeline -->
  <g>
    <rect x="800" y="228" width="156" height="72" rx="11" fill="#052e1a" stroke="#15803d"/>
    <text x="878" y="255" class="label green" font-size="15" text-anchor="middle">World Hit</text>
    <text x="878" y="279" class="mono" font-size="13" text-anchor="middle">P<tspan baseline-shift="sub" font-size="10">hit</tspan></text>

    <path d="M964 264 H1006" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="1016" y="228" width="158" height="72" rx="11" fill="#0f2538" stroke="#0e7490"/>
    <text x="1095" y="255" class="label cyan" font-size="15" text-anchor="middle">Clip Position</text>
    <text x="1095" y="279" class="mono" font-size="12" text-anchor="middle">VP · float4(P,1)</text>

    <path d="M1182 264 H1224" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="1234" y="228" width="108" height="72" rx="11" fill="#2e1065" stroke="#7c3aed"/>
    <text x="1288" y="255" class="label violet" font-size="15" text-anchor="middle">Depth</text>
    <text x="1288" y="279" class="mono" font-size="13" text-anchor="middle">clip.z / w</text>
  </g>

  <rect x="800" y="320" width="542" height="57" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="821" y="345" class="mono" font-size="14">float4 H = mul(ViewProjection, float4(P<tspan baseline-shift="sub" font-size="10">hit</tspan>, 1));</text>
  <text x="821" y="365" class="mono violet" font-size="14">PixelDepth = H.z / H.w;</text>

  <!-- depth buffer visualization -->
  <text x="800" y="417" class="label" font-size="17">该像素的 Reverse-Z 深度轴</text>
  <text x="1338" y="417" class="body" font-size="13" text-anchor="end">近 = 1，远 = 0</text>

  <rect x="822" y="449" width="494" height="28" rx="14" fill="#172033" stroke="#475569"/>
  <rect x="822" y="449" width="207" height="28" rx="14" fill="#312e81" opacity="0.62"/>
  <rect x="1029" y="449" width="287" height="28" rx="14" fill="#064e3b" opacity="0.48"/>
  <text x="822" y="500" class="mono" font-size="13" text-anchor="middle">0 · far</text>
  <text x="1316" y="500" class="mono" font-size="13" text-anchor="middle">1 · near</text>

  <line x1="975" y1="440" x2="975" y2="487" stroke="#a78bfa" stroke-width="3"/>
  <circle cx="975" cy="463" r="7" fill="#a78bfa"/>
  <text x="975" y="527" class="mono violet" font-size="13" text-anchor="middle">SceneDepth = 0.31</text>

  <line x1="1029" y1="434" x2="1029" y2="492" stroke="#4ade80" stroke-width="4"/>
  <circle cx="1029" cy="463" r="8" fill="#4ade80" stroke="#dcfce7" stroke-width="2"/>
  <text x="1029" y="551" class="mono green" font-size="13" text-anchor="middle">HitDepth = 0.42</text>

  <path d="M1044 536 H1254" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1148" y="526" class="body" font-size="12" text-anchor="middle">更大 = 更近</text>

  <rect x="800" y="578" width="542" height="116" rx="12" fill="#052e1a" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="830" cy="615" r="10" fill="#4ade80"/>
  <text x="854" y="611" class="label green" font-size="16">Depth Test 通过</text>
  <text x="854" y="638" class="mono" font-size="14">HitDepth 0.42 &gt; SceneDepth 0.31</text>
  <text x="822" y="673" class="body" font-size="14">写出 SV_Depth = HitDepth；像素落在体素真实表面，</text>
  <text x="822" y="692" class="body" font-size="14">而不是停留在 Billboard 画布平面上。</text>

  <!-- bottom mechanism strip -->
  <rect x="62" y="772" width="1316" height="82" rx="15" fill="#0c1628" stroke="#1e3a5f"/>
  <text x="88" y="803" class="label" font-size="16">画布 + 重建</text>
  <g font-size="14">
    <rect x="218" y="788" width="192" height="48" rx="10" fill="#0f2538" stroke="#0e7490"/>
    <text x="314" y="808" class="mono cyan" text-anchor="middle">Billboard raster</text>
    <text x="314" y="827" class="body" text-anchor="middle">覆盖屏幕像素</text>
    <path d="M418 812 H458" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="468" y="788" width="194" height="48" rx="10" fill="#0f2538" stroke="#0e7490"/>
    <text x="565" y="808" class="mono amber" text-anchor="middle">Ray + HitT</text>
    <text x="565" y="827" class="body" text-anchor="middle">重建真实命中点</text>
    <path d="M670 812 H710" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="720" y="788" width="207" height="48" rx="10" fill="#0f2538" stroke="#0e7490"/>
    <text x="823" y="808" class="mono violet" text-anchor="middle">project → Depth</text>
    <text x="823" y="827" class="body" text-anchor="middle">获得真实屏幕深度</text>
    <path d="M935 812 H975" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="985" y="788" width="343" height="48" rx="10" fill="#19261d" stroke="#15803d"/>
    <text x="1156" y="808" class="mono green" text-anchor="middle">SV_Depth → scene occlusion</text>
    <text x="1156" y="827" class="body" text-anchor="middle">正确参与场景遮挡与交叠</text>
  </g>
</svg>