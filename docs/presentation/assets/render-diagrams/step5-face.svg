<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="62 148 720 590">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172238" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#101827" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="hitTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity="0.70"/>
    </linearGradient>
    <linearGradient id="hitSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#be123c" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#881337" stop-opacity="0.60"/>
    </linearGradient>
    <filter id="glowAmber" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4ade80"/>
    </marker>
    <style>
      .title { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-weight: 700; fill: #f8fafc; }
      .label { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-weight: 600; fill: #e2e8f0; }
      .body { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #94a3b8; }
      .mono { font-family: Consolas, "SFMono-Regular", monospace; fill: #cbd5e1; }
      .cyan { fill: #22d3ee; }
      .amber { fill: #fbbf24; }
      .green { fill: #4ade80; }
      .red { fill: #fb7185; }
      .violet { fill: #a78bfa; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <circle cx="1310" cy="100" r="230" fill="#0ea5e9" opacity="0.05"/>
  <circle cx="80" cy="850" r="260" fill="#8b5cf6" opacity="0.04"/>

  <text x="72" y="76" class="title" font-size="34">Step 5 · 法线确定：由最后一次 DDA 跨面直接得到体素表面方向</text>
  <text x="72" y="111" class="body" font-size="17">记录进入命中体素时跨越的轴；法线与该步进方向相反，无需再从 HitPos 猜测最近表面</text>

  <rect x="62" y="148" width="720" height="590" rx="22" fill="url(#panel)" stroke="#334155" stroke-width="1.5"/>
  <rect x="810" y="148" width="568" height="590" rx="22" fill="url(#panel)" stroke="#334155" stroke-width="1.5"/>

  <circle cx="94" cy="188" r="14" fill="#22d3ee" opacity="0.16"/>
  <text x="94" y="194" class="label cyan" font-size="15" text-anchor="middle">1</text>
  <text x="120" y="195" class="title" font-size="22">跨过 +X 网格面，命中 −X 外表面</text>
  <text x="738" y="195" class="mono" font-size="14" text-anchor="end">Block Local</text>

  <!-- local grid context -->
  <g fill="none">
    <g stroke="#33465d" stroke-width="1.15" stroke-dasharray="7 6" opacity="0.58">
      <path d="M196 596 L406 671 L686 571"/>
      <path d="M196 526 L406 601 L686 501"/>
      <path d="M476 496 L266 421 M546 471 L336 396 M616 446 L406 371"/>
      <path d="M406 601 V461 M476 576 V436 M546 551 V411 M616 526 V386"/>
    </g>
    <g stroke="#53677f" stroke-width="1.25" opacity="0.86">
      <path d="M196 456 L406 531 L686 431 L476 356 Z"/>
      <path d="M196 596 V456 M406 671 V531 M686 571 V431"/>
      <path d="M266 571 V431 M336 646 V506 M476 646 V506 M546 621 V481 M616 596 V456"/>
    </g>
  </g>

  <!-- previous cell -->
  <g stroke="#a78bfa" stroke-width="1.6">
    <polygon points="336,506 406,531 476,506 406,481" fill="#a78bfa" opacity="0.16"/>
    <polygon points="336,506 406,531 406,461 336,436" fill="#a78bfa" opacity="0.09"/>
    <polygon points="406,531 476,506 476,436 406,461" fill="#a78bfa" opacity="0.09"/>
  </g>
  <text x="391" y="492" class="mono violet" font-size="12" text-anchor="middle">previous</text>
  <text x="391" y="509" class="mono violet" font-size="11" text-anchor="middle">(2,2,1)</text>

  <!-- hit voxel -->
  <g stroke="#fb7185" stroke-width="2.2">
    <polygon points="406,481 476,506 546,481 476,456" fill="url(#hitTop)"/>
    <polygon points="406,481 476,506 476,436 406,411" fill="url(#hitSide)"/>
    <polygon points="476,506 546,481 546,411 476,436" fill="#9f1239" opacity="0.78"/>
    <path d="M476 456 V386 M476 386 L546 411 M476 386 L406 411" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="7 6" opacity="0.58"/>
  </g>
  <text x="486" y="462" class="title" font-size="14" text-anchor="middle">HIT</text>
  <text x="486" y="479" class="mono" font-size="11" text-anchor="middle">(3,2,1)</text>

  <!-- entry face emphasis -->
  <polygon points="406,411 476,436 476,506 406,481" fill="#4ade80" opacity="0.25" stroke="#4ade80" stroke-width="3"/>
  <text x="434" y="459" class="label green" font-size="13" text-anchor="middle">−X face</text>

  <!-- ray and crossing -->
  <path d="M150 604 L650 304" fill="none" stroke="#fbbf24" stroke-width="2.8" marker-end="url(#arrowAmber)" filter="url(#glowAmber)"/>
  <circle cx="431" cy="435" r="10" fill="#4ade80" stroke="#dcfce7" stroke-width="2" filter="url(#glowGreen)"/>
  <path d="M431 435 L360 478" stroke="#4ade80" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <text x="313" y="504" class="label green" font-size="15">N<tspan baseline-shift="sub" font-size="11">local</tspan> = (−1,0,0)</text>

  <!-- step direction -->
  <path d="M352 487 L449 429" stroke="#22d3ee" stroke-width="2.4" marker-end="url(#arrowCyan)"/>
  <text x="329" y="452" class="mono cyan" font-size="13">stepX = +1</text>

  <rect x="105" y="236" width="261" height="90" rx="11" fill="#082f49" stroke="#0e7490"/>
  <text x="124" y="263" class="label cyan" font-size="15">最后一次 DDA 决策</text>
  <text x="124" y="288" class="mono" font-size="14">axis = X</text>
  <text x="124" y="312" class="mono" font-size="14">cell.x += +1</text>

  <rect x="102" y="658" width="640" height="60" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="124" y="682" class="mono green" font-size="15">Nlocal = −step[axis] · axisUnit</text>
  <text x="124" y="705" class="body" font-size="13">本例：axis=X，stepX=+1 → Nlocal=−X；始终朝向射线来向一侧。</text>

  <circle cx="842" cy="188" r="14" fill="#22d3ee" opacity="0.16"/>
  <text x="842" y="194" class="label cyan" font-size="15" text-anchor="middle">2</text>
  <text x="868" y="195" class="title" font-size="22">转换到世界空间并用于着色</text>
  <text x="1336" y="195" class="mono" font-size="14" text-anchor="end">Local → World</text>

  <!-- normal pipeline -->
  <g>
    <rect x="848" y="230" width="148" height="72" rx="11" fill="#052e1a" stroke="#15803d"/>
    <text x="922" y="257" class="label green" font-size="15" text-anchor="middle">Local Normal</text>
    <text x="922" y="282" class="mono" font-size="13" text-anchor="middle">(−1, 0, 0)</text>

    <path d="M1004 266 H1045" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="1055" y="230" width="171" height="72" rx="11" fill="#0f2538" stroke="#0e7490"/>
    <text x="1140" y="257" class="label cyan" font-size="15" text-anchor="middle">Normal Matrix</text>
    <text x="1140" y="282" class="mono" font-size="12" text-anchor="middle">transpose(inv(M))</text>

    <path d="M1234 266 H1266" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="1276" y="230" width="70" height="72" rx="11" fill="#2e1065" stroke="#7c3aed"/>
    <text x="1311" y="257" class="label violet" font-size="14" text-anchor="middle">World</text>
    <text x="1311" y="281" class="mono" font-size="13" text-anchor="middle">Nw</text>
  </g>

  <rect x="848" y="323" width="498" height="63" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="869" y="349" class="mono" font-size="13">Nworld = normalize(mul(Nlocal, NormalMatrix));</text>
  <text x="869" y="372" class="body" font-size="13">若仅旋转或均匀缩放，可直接使用 BlockToWorld 的 3×3 旋转部分。</text>

  <!-- lighting visualization -->
  <text x="848" y="425" class="label" font-size="17">表面方向进入光照计算</text>
  <g>
    <polygon points="1050,475 1160,435 1248,495 1135,538" fill="#be123c" opacity="0.72" stroke="#fb7185" stroke-width="2"/>
    <polygon points="1050,475 1135,538 1135,633 1050,568" fill="#881337" opacity="0.68" stroke="#fb7185" stroke-width="2"/>
    <polygon points="1135,538 1248,495 1248,587 1135,633" fill="#9f1239" opacity="0.62" stroke="#fb7185" stroke-width="2"/>
    <path d="M1160 435 V529 M1160 529 L1248 587 M1160 529 L1050 568" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="7 6" opacity="0.55"/>

    <circle cx="1076" cy="494" r="8" fill="#4ade80"/>
    <path d="M1076 494 L952 538" stroke="#4ade80" stroke-width="4" marker-end="url(#arrowGreen)"/>
    <text x="868" y="559" class="mono green" font-size="14">Nworld</text>

    <circle cx="924" cy="455" r="19" fill="#fbbf24" opacity="0.22"/>
    <circle cx="924" cy="455" r="9" fill="#fbbf24"/>
    <path d="M946 462 L1049 492" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
    <text x="862" y="447" class="label amber" font-size="14">Light L</text>
  </g>

  <rect x="848" y="652" width="498" height="66" rx="11" fill="#052e1a" stroke="#15803d"/>
  <text x="870" y="678" class="mono green" font-size="15">NdotL = saturate(dot(Nworld, L))</text>
  <text x="870" y="702" class="body" font-size="13">同一法线也可写入 GBuffer，用于阴影、反射与后处理。</text>

  <!-- bottom notes -->
  <rect x="62" y="772" width="1316" height="82" rx="15" fill="#0c1628" stroke="#1e3a5f"/>
  <text x="88" y="803" class="label" font-size="16">边界规则</text>
  <g font-size="13">
    <rect x="191" y="788" width="328" height="48" rx="10" fill="#0f2538" stroke="#0e7490"/>
    <text x="355" y="808" class="mono cyan" text-anchor="middle">常规命中：normal = −stepAxis</text>
    <text x="355" y="827" class="body" text-anchor="middle">保留本轮 argmin(tMax) 的跨面轴</text>

    <rect x="538" y="788" width="361" height="48" rx="10" fill="#2e1065" stroke="#7c3aed"/>
    <text x="718" y="808" class="mono violet" text-anchor="middle">多轴相等：采用固定 tie-break</text>
    <text x="718" y="827" class="body" text-anchor="middle">或按跨面 mask 生成棱 / 角法线</text>

    <rect x="918" y="788" width="414" height="48" rx="10" fill="#19261d" stroke="#15803d"/>
    <text x="1125" y="808" class="mono green" text-anchor="middle">entry cell 已为 solid：使用 AABB 入射面</text>
    <text x="1125" y="827" class="body" text-anchor="middle">沿用 ray-box 的 tEntryAxis 与符号</text>
  </g>
</svg>