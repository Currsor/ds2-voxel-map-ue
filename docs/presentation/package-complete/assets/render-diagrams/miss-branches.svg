<svg xmlns="http://www.w3.org/2000/svg" width="1316" height="520" viewBox="62 148 1316 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172238" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#101827" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="glowRed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#fb7185"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22d3ee"/>
    </marker>
    <style>
      .title { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-weight: 700; fill: #f8fafc; }
      .label { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-weight: 600; fill: #e2e8f0; }
      .body { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #94a3b8; }
      .mono { font-family: Consolas, "SFMono-Regular", monospace; fill: #cbd5e1; }
      .cyan { fill: #22d3ee; }
      .amber { fill: #fbbf24; }
      .red { fill: #fb7185; }
      .violet { fill: #a78bfa; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <circle cx="1310" cy="100" r="230" fill="#0ea5e9" opacity="0.05"/>
  <circle cx="80" cy="850" r="260" fill="#8b5cf6" opacity="0.04"/>

  <text x="72" y="76" class="title" font-size="34">补充 · 未命中分支：任一失败条件都终止当前像素</text>
  <text x="72" y="111" class="body" font-size="17">Billboard 只提供光栅覆盖；射线没有找到实体体素时立即 discard，不向颜色与深度缓冲写入</text>

  <rect x="62" y="148" width="412" height="520" rx="22" fill="url(#panel)" stroke="#334155" stroke-width="1.5"/>
  <rect x="514" y="148" width="412" height="520" rx="22" fill="url(#panel)" stroke="#334155" stroke-width="1.5"/>
  <rect x="966" y="148" width="412" height="520" rx="22" fill="url(#panel)" stroke="#334155" stroke-width="1.5"/>

  <circle cx="94" cy="188" r="14" fill="#fb7185" opacity="0.18"/>
  <text x="94" y="194" class="label red" font-size="15" text-anchor="middle">A</text>
  <text x="120" y="195" class="title" font-size="20">Ray–Box 无交</text>
  <text x="438" y="195" class="mono" font-size="12" text-anchor="end">reject before DDA</text>

  <g>
    <polygon points="196,314 299,279 371,330 266,367" fill="#0c4a6e" opacity="0.28" stroke="#38bdf8" stroke-width="1.8"/>
    <polygon points="196,314 266,367 266,478 196,423" fill="#075985" opacity="0.26" stroke="#38bdf8" stroke-width="1.8"/>
    <polygon points="266,367 371,330 371,439 266,478" fill="#0c4a6e" opacity="0.30" stroke="#0ea5e9" stroke-width="1.8"/>
    <path d="M299 279 V389 M299 389 L371 439 M299 389 L196 423" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="7 6" opacity="0.62"/>
    <text x="282" y="388" class="label cyan" font-size="14" text-anchor="middle">Block AABB</text>
  </g>
  <path d="M98 492 L424 251" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrowAmber)"/>
  <circle cx="98" cy="492" r="6" fill="#fbbf24"/>
  <path d="M154 448 L400 266" fill="none" stroke="#fb7185" stroke-width="1.4" stroke-dasharray="7 6" opacity="0.55"/>
  <text x="112" y="524" class="label amber" font-size="14">射线从盒体上方掠过</text>

  <rect x="94" y="550" width="348" height="88" rx="11" fill="#3f0d18" stroke="#be123c"/>
  <text x="114" y="578" class="label red" font-size="15">Slab 区间交集为空</text>
  <text x="114" y="603" class="mono" font-size="13">tEntry &gt; tExit  或  tExit &lt; 0</text>
  <text x="114" y="625" class="body" font-size="12">没有有效 [tEntry, tExit]，不初始化 DDA</text>

  <circle cx="546" cy="188" r="14" fill="#fb7185" opacity="0.18"/>
  <text x="546" y="194" class="label red" font-size="15" text-anchor="middle">B</text>
  <text x="572" y="195" class="title" font-size="20">DDA 超过 tExit</text>
  <text x="890" y="195" class="mono" font-size="12" text-anchor="end">leave valid segment</text>

  <g fill="none">
    <g stroke="#33465d" stroke-width="1.1" stroke-dasharray="7 6" opacity="0.58">
      <path d="M584 459 L700 501 L856 445"/>
      <path d="M584 411 L700 453 L856 397"/>
      <path d="M739 439 L623 397 M778 425 L662 383 M817 411 L700 369"/>
      <path d="M700 501 V405 M739 487 V391 M778 473 V377 M817 459 V363"/>
    </g>
    <g stroke="#53677f" stroke-width="1.2" opacity="0.84">
      <path d="M584 363 L700 405 L856 349 L739 307 Z"/>
      <path d="M584 459 V363 M700 501 V405 M856 445 V349"/>
      <path d="M623 473 V377 M662 487 V391 M739 487 V391 M778 473 V377 M817 459 V363"/>
    </g>
  </g>
  <path d="M552 500 L895 273" fill="none" stroke="#fbbf24" stroke-width="2.8" marker-end="url(#arrowAmber)"/>
  <path d="M608 463 L815 326" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
  <g>
    <circle cx="608" cy="463" r="7" fill="#22d3ee"/>
    <circle cx="665" cy="425" r="7" fill="#22d3ee"/>
    <circle cx="722" cy="388" r="7" fill="#22d3ee"/>
    <circle cx="779" cy="350" r="7" fill="#22d3ee"/>
    <circle cx="815" cy="326" r="9" fill="#fb7185" stroke="#ffe4e6" stroke-width="2"/>
  </g>
  <path d="M815 286 V481" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="824" y="304" class="mono red" font-size="13">tExit = 6</text>
  <path d="M835 339 L872 315" stroke="#fb7185" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="838" y="365" class="mono red" font-size="12">nextT = 6.4</text>

  <rect x="546" y="550" width="348" height="88" rx="11" fill="#3f0d18" stroke="#be123c"/>
  <text x="566" y="578" class="label red" font-size="15">下一次跨面已在盒外</text>
  <text x="566" y="603" class="mono" font-size="13">min(tMax) &gt; tExit</text>
  <text x="566" y="625" class="body" font-size="12">停止步进，禁止访问 Block 外部 cell</text>

  <circle cx="998" cy="188" r="14" fill="#fb7185" opacity="0.18"/>
  <text x="998" y="194" class="label red" font-size="15" text-anchor="middle">C</text>
  <text x="1024" y="195" class="title" font-size="20">遍历完仍为空</text>
  <text x="1342" y="195" class="mono" font-size="12" text-anchor="end">no solid voxel</text>

  <text x="998" y="244" class="label" font-size="15">有效区间内逐格检查 occupancy</text>
  <path d="M1007 308 H1337" stroke="#475569" stroke-width="2"/>
  <g font-size="12" text-anchor="middle">
    <rect x="992" y="282" width="72" height="52" rx="8" fill="#172033" stroke="#475569"/>
    <text x="1028" y="303" class="mono">cell 0</text><text x="1028" y="322" class="body">empty</text>
    <rect x="1076" y="282" width="72" height="52" rx="8" fill="#172033" stroke="#475569"/>
    <text x="1112" y="303" class="mono">cell 1</text><text x="1112" y="322" class="body">empty</text>
    <rect x="1160" y="282" width="72" height="52" rx="8" fill="#172033" stroke="#475569"/>
    <text x="1196" y="303" class="mono">cell 2</text><text x="1196" y="322" class="body">empty</text>
    <rect x="1244" y="282" width="72" height="52" rx="8" fill="#172033" stroke="#475569"/>
    <text x="1280" y="303" class="mono">cell N</text><text x="1280" y="322" class="body">empty</text>
  </g>
  <path d="M1028 351 C1080 405 1230 405 1280 351" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1154" y="421" class="mono violet" font-size="13" text-anchor="middle">all occupancy == 0</text>

  <g transform="translate(1050 448)">
    <circle cx="0" cy="0" r="14" fill="#172033" stroke="#475569"/>
    <path d="M-6 -6 L6 6 M6 -6 L-6 6" stroke="#94a3b8" stroke-width="2"/>
    <path d="M32 0 H235" stroke="#fb7185" stroke-width="2.2" marker-end="url(#arrowRed)"/>
    <text x="132" y="-13" class="body" font-size="12" text-anchor="middle">没有产生 HitCell / HitT</text>
  </g>

  <rect x="998" y="550" width="348" height="88" rx="11" fill="#3f0d18" stroke="#be123c"/>
  <text x="1018" y="578" class="label red" font-size="15">循环正常结束但未置 hit</text>
  <text x="1018" y="603" class="mono" font-size="13">hit == false</text>
  <text x="1018" y="625" class="body" font-size="12">有效段全部为空，同样属于未命中</text>

  <path d="M268 668 C268 708 518 714 620 750" fill="none" stroke="#fb7185" stroke-width="2.2" marker-end="url(#arrowRed)"/>
  <path d="M720 668 V741" fill="none" stroke="#fb7185" stroke-width="2.2" marker-end="url(#arrowRed)"/>
  <path d="M1172 668 C1172 708 922 714 820 750" fill="none" stroke="#fb7185" stroke-width="2.2" marker-end="url(#arrowRed)"/>

  <rect x="62" y="758" width="1316" height="96" rx="15" fill="#270b16" stroke="#be123c" stroke-width="1.5"/>
  <circle cx="105" cy="806" r="22" fill="#fb7185" opacity="0.16"/>
  <path d="M94 795 L116 817 M116 795 L94 817" stroke="#fb7185" stroke-width="4"/>
  <text x="143" y="797" class="title red" font-size="24">discard</text>
  <text x="143" y="825" class="body" font-size="14">终止当前 Billboard fragment；该像素保持原场景结果</text>

  <g font-size="13">
    <rect x="645" y="778" width="206" height="56" rx="10" fill="#3f0d18" stroke="#be123c"/>
    <text x="748" y="801" class="mono red" text-anchor="middle">no SceneColor write</text>
    <text x="748" y="822" class="body" text-anchor="middle">不输出体素颜色</text>
    <rect x="870" y="778" width="206" height="56" rx="10" fill="#3f0d18" stroke="#be123c"/>
    <text x="973" y="801" class="mono red" text-anchor="middle">no SV_Depth write</text>
    <text x="973" y="822" class="body" text-anchor="middle">不遮挡后方场景</text>
    <rect x="1095" y="778" width="241" height="56" rx="10" fill="#0f172a" stroke="#475569"/>
    <text x="1215" y="801" class="mono" text-anchor="middle">billboard ≠ geometry</text>
    <text x="1215" y="822" class="body" text-anchor="middle">画布覆盖不代表体素命中</text>
  </g>
</svg>
