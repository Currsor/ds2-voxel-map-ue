  <text x="91" y="461" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#ffffff">2</text>
  <text x="122" y="462" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#0f172a">按入口生成透视或正交采集任务</text>

  <g transform="translate(82 490)">
    <rect width="276" height="228" rx="16" fill="url(#blueCard)" stroke="#93c5fd" stroke-width="2"/>
    <text x="138" y="30" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">单视图</text>
    <path d="M32 177C67 137 92 171 121 112C146 62 178 122 203 151C221 172 237 153 251 169" fill="none" stroke="#f97316" stroke-width="5"/>
