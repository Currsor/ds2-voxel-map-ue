    <path d="M62 96L82 86V124L62 114Z" fill="#60a5fa"/>
    <path d="M84 105L166 127" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <path d="M84 92L212 63V184L84 118Z" fill="#3b82f6" fill-opacity=".08" stroke="#60a5fa" stroke-width="2"/>
    <text x="138" y="211" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#334155">1 个透视任务</text>
  </g>

  <g transform="translate(382 490)">
    <rect width="276" height="228" rx="16" fill="url(#blueCard)" stroke="#93c5fd" stroke-width="2"/>
    <text x="138" y="30" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">Fibonacci 半球</text>
    <path d="M31 165A107 91 0 0 1 245 165" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-dasharray="7 6"/>
    <g fill="#2563eb"><circle cx="34" cy="155" r="7"/><circle cx="65" cy="91" r="7"/><circle cx="138" cy="61" r="7"/><circle cx="211" cy="91" r="7"/><circle cx="242" cy="155" r="7"/></g>
    <g stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"><path d="M44 154L116 137"/><path d="M73 98L123 127"/><path d="M138 70V119"/><path d="M203 98L153 127"/><path d="M232 154L160 137"/></g>
    <path d="M58 181C88 149 110 176 136 126C157 86 181 136 201 163C216 181 229 165 241 177" fill="none" stroke="#f97316" stroke-width="5"/>
    <text x="138" y="211" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#334155">N 个上半球透视任务</text>
  </g>

  <g transform="translate(682 490)">
    <rect width="276" height="228" rx="16" fill="url(#purpleCard)" stroke="#c4b5fd" stroke-width="2"/>
    <text x="138" y="30" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#6d28d9">XYZ 薄层切片</text>
    <rect x="56" y="60" width="164" height="120" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <path d="M97 60V180M138 60V180M179 60V180" stroke="#cbd5e1" stroke-dasharray="5 5"/>
    <rect x="116" y="60" width="44" height="120" fill="#8b5cf6" fill-opacity=".24" stroke="#7c3aed" stroke-width="3"/>
    <path d="M16 120H103" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <path d="M260 120H173" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <text x="138" y="211" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#334155">各轴 × 各薄层 × 1/2 方向</text>
  </g>

  <g transform="translate(982 490)">
    <rect width="276" height="228" rx="16" fill="url(#greenCard)" stroke="#6ee7b7" stroke-width="2"/>
    <text x="138" y="30" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#047857">联合世界采集</text>
    <circle cx="75" cy="108" r="45" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <path d="M42 121A33 29 0 0 1 108 121" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="6 5"/>
    <circle cx="48" cy="101" r="5" fill="#2563eb"/><circle cx="75" cy="80" r="5" fill="#2563eb"/><circle cx="102" cy="101" r="5" fill="#2563eb"/>
    <text x="138" y="114" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#059669">+</text>
    <rect x="169" y="65" width="68" height="88" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="192" y="65" width="22" height="88" fill="#8b5cf6" fill-opacity=".30"/>
    <path d="M150 108H184" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <text x="138" y="211" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#334155">半球任务 + XYZ 任务</text>
  </g>

  <g transform="translate(1284 490)">
    <rect width="232" height="228" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="116" y="30" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#334155">任务中记录</text>
    <text x="20" y="66" font-family="Consolas, monospace" font-size="14" fill="#334155">CameraPosition</text>
    <text x="20" y="92" font-family="Consolas, monospace" font-size="14" fill="#334155">CameraRotation</text>
    <text x="20" y="118" font-family="Consolas, monospace" font-size="14" fill="#334155">bOrthographic</text>
    <text x="20" y="144" font-family="Consolas, monospace" font-size="14" fill="#334155">OrthoWidth</text>
    <text x="20" y="170" font-family="Consolas, monospace" font-size="14" fill="#334155">SlabAxis</text>
    <text x="20" y="196" font-family="Consolas, monospace" font-size="14" fill="#334155">SlabMin / SlabMax</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="56" y="786" width="1488" height="138" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <circle cx="91" cy="823" r="18" fill="#0f172a"/>
  <text x="91" y="829" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#ffffff">3</text>
  <text x="122" y="830" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#0f172a">统一排入 FCaptureJob 队列</text>

  <g transform="translate(410 810)">
    <rect x="0" y="35" width="150" height="52" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="180" y="35" width="150" height="52" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="360" y="35" width="150" height="52" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <rect x="540" y="35" width="150" height="52" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="75" y="67" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#1e40af">透视 Job 0</text>
    <text x="255" y="67" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#1e40af">透视 Job N</text>
    <text x="435" y="67" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#6d28d9">切片 Job 0</text>
    <text x="615" y="67" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#6d28d9">切片 Job M</text>
    <path d="M702 61H817" stroke="#059669" stroke-width="5" marker-end="url(#arrowGreen)"/>
    <rect x="835" y="24" width="230" height="74" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
    <text x="950" y="54" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#047857">下一步：GPU 采集</text>
    <text x="950" y="80" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#334155">Depth → BaseColor → Readback</text>
  </g>

  <text x="76" y="955" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#475569">蓝色：透视视图　紫色：正交切片　橙色：场景表面　网格扩展区域来自 4×4×4 Block 对齐</text>
</svg>