<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="purpleCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#faf5ff"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrowSlate" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L9 3L0 6Z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L9 3L0 6Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L9 3L0 6Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L9 3L0 6Z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="1600" height="980" rx="28" fill="url(#pageBg)"/>
  <text x="56" y="62" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#0f172a">第 2 步 · 从采集范围生成视图任务</text>
  <text x="56" y="98" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#475569">CaptureBounds → 对齐体素网格 → 透视 / 正交视图 → FCaptureJob 队列 → GPU 采集</text>

  <g filter="url(#shadow)">
    <rect x="56" y="132" width="1488" height="260" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <circle cx="91" cy="169" r="18" fill="#0f172a"/>
  <text x="91" y="175" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <text x="122" y="176" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#0f172a">确定世界范围并建立对齐网格</text>

  <g transform="translate(88 204)">
    <path d="M20 65L104 20L248 20L164 65Z" fill="#dbeafe" stroke="#64748b" stroke-width="2"/>
    <path d="M20 65V160L164 160V65Z" fill="#eff6ff" stroke="#64748b" stroke-width="2"/>
    <path d="M164 65V160L248 115V20Z" fill="#bfdbfe" stroke="#64748b" stroke-width="2"/>
    <path d="M20 65L164 65L248 20" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/>
    <path d="M50 137C80 98 105 131 131 91C150 62 172 95 194 119" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
    <text x="134" y="188" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#334155">CaptureBounds 世界 AABB</text>
  </g>

  <path d="M378 287H458" stroke="#475569" stroke-width="4" marker-end="url(#arrowSlate)"/>
  <text x="418" y="268" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#475569">÷ VoxelSize</text>

  <g transform="translate(482 207)">
    <rect x="0" y="0" width="248" height="154" rx="8" fill="url(#grid)" stroke="#64748b" stroke-width="2"/>
    <path d="M0 103H248M165 0V154" stroke="#f97316" stroke-width="3"/>
    <text x="124" y="181" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#334155">原始体素数量：ceil(Size / VoxelSize)</text>
    <text x="124" y="202" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#64748b">示例：100 × 50 × 80</text>
  </g>

  <path d="M770 287H850" stroke="#475569" stroke-width="4" marker-end="url(#arrowSlate)"/>
  <text x="810" y="268" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#475569">向上对齐到 4</text>

  <g transform="translate(874 207)">
    <rect x="0" y="0" width="248" height="154" rx="8" fill="url(#grid)" stroke="#2563eb" stroke-width="3"/>
    <rect x="220" y="0" width="28" height="154" fill="#60a5fa" fill-opacity=".25"/>
    <path d="M0 110H248" stroke="#2563eb" stroke-width="3"/>
    <text x="124" y="181" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#1d4ed8">Block 对齐网格：4 × 4 × 4</text>
    <text x="124" y="202" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#64748b">示例：100 × 52 × 80</text>
  </g>

  <path d="M1162 287H1242" stroke="#475569" stroke-width="4" marker-end="url(#arrowSlate)"/>

  <g transform="translate(1264 204)">
    <rect x="0" y="0" width="242" height="158" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="121" y="30" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#0f172a">坐标映射与世界原点</text>
    <text x="18" y="61" font-family="Consolas, monospace" font-size="14" fill="#334155">Voxel X → World X</text>
    <text x="18" y="86" font-family="Consolas, monospace" font-size="14" fill="#334155">Voxel Y → World Z</text>
    <text x="18" y="111" font-family="Consolas, monospace" font-size="14" fill="#334155">Voxel Z → World Y</text>
    <text x="18" y="139" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#475569">Origin = Center − AlignedSize / 2</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="56" y="418" width="1488" height="342" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
