    <line x1="90" y1="267" x2="320" y2="267"/><line x1="90" y1="319" x2="320" y2="319"/><line x1="90" y1="371" x2="320" y2="371"/><line x1="90" y1="423" x2="320" y2="423"/>
    <line x1="531" y1="215" x2="531" y2="475"/><line x1="577" y1="215" x2="577" y2="475"/><line x1="623" y1="215" x2="623" y2="475"/><line x1="669" y1="215" x2="669" y2="475"/>
    <line x1="485" y1="267" x2="715" y2="267"/><line x1="485" y1="319" x2="715" y2="319"/><line x1="485" y1="371" x2="715" y2="371"/><line x1="485" y1="423" x2="715" y2="423"/>
    <line x1="926" y1="215" x2="926" y2="475"/><line x1="972" y1="215" x2="972" y2="475"/><line x1="1018" y1="215" x2="1018" y2="475"/><line x1="1064" y1="215" x2="1064" y2="475"/>
    <line x1="880" y1="267" x2="1110" y2="267"/><line x1="880" y1="319" x2="1110" y2="319"/><line x1="880" y1="371" x2="1110" y2="371"/><line x1="880" y1="423" x2="1110" y2="423"/>
