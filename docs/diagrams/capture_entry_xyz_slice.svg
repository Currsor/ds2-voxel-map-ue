  <g font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#6d28d9">
    <text x="63" y="329">+X 方向</text><text x="274" y="329">−X 方向</text>
    <text x="615" y="200">+Y 方向</text><text x="615" y="507">−Y 方向</text>
    <text x="850" y="329">+Z 方向</text><text x="1065" y="329">−Z 方向</text>
  </g>
  <text x="205" y="502" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#475569">SlabAxis = X</text>
  <text x="600" y="502" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#475569">SlabAxis = Y</text>
  <text x="995" y="502" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#475569">SlabAxis = Z</text>
  <rect x="82" y="536" width="22" height="16" fill="#8b5cf6" fill-opacity=".25" stroke="#7c3aed"/><text x="115" y="550" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#334155">当前薄层：SlabMin ≤ AxisValue ≤ SlabMax</text>
  <line x1="477" y1="544" x2="501" y2="544" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrowPurple)"/><text x="512" y="550" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#334155">双向正交采集可降低单侧遮挡</text>
  <text x="859" y="550" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#b45309">三个轴依次执行，并非同时裁切</text>
  <rect x="58" y="640" width="1084" height="44" rx="10" fill="#f5f3ff"/>
  <text x="80" y="668" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#5b21b6">输出：各轴、各薄层、各方向的正交视图统一融合，用更高任务量换取更少的深层遮挡缺失。</text>
</svg>