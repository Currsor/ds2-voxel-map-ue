<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fafafa"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#7c3aed"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="700" rx="24" fill="url(#bg)"/>
  <text x="48" y="58" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#0f172a">入口 3 · XYZ 切片采集</text>
  <text x="48" y="92" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#475569">沿每个启用轴逐层移动正交相机 · 每次任务只接受当前 Slab 内的重建点</text>
