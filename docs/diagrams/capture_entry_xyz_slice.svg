  <rect x="180" y="215" width="48" height="260" fill="#8b5cf6" fill-opacity=".22" stroke="#7c3aed" stroke-width="3"/>
  <rect x="485" y="317" width="230" height="56" fill="#8b5cf6" fill-opacity=".22" stroke="#7c3aed" stroke-width="3"/>
  <rect x="972" y="215" width="48" height="260" fill="#8b5cf6" fill-opacity=".22" stroke="#7c3aed" stroke-width="3"/>
  <g fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round">
    <path d="M101 433 C138 380 162 424 193 330 C223 251 254 339 306 403"/>
    <path d="M496 433 C533 380 557 424 588 330 C618 251 649 339 701 403"/>
    <path d="M891 433 C928 380 952 424 983 330 C1013 251 1044 339 1096 403"/>
