<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="orangeCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="purpleCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#faf5ff"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrowSlate" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L9 3L0 6Z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L9 3L0 6Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L9 3L0 6Z" fill="#ea580c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L9 3L0 6Z" fill="#059669"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L9 3L0 6Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1600" height="1100" rx="28" fill="url(#pageBg)"/>
  <text x="56" y="62" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#0f172a">第 3 步 · GPU 双通道场景采集</text>
  <text x="56" y="98" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#475569">FCaptureJob → 配置相机 → SceneDepth → BaseColor → GPU Readback → DepthPixels + ColorPixels</text>

  <g filter="url(#shadow)">
    <rect x="56" y="130" width="1488" height="192" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <circle cx="91" cy="167" r="18" fill="#0f172a"/>
  <text x="91" y="173" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <text x="122" y="174" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#0f172a">从任务队列取出一个 FCaptureJob，配置复用的采集相机</text>

  <g transform="translate(112 208)">
    <rect x="0" y="0" width="210" height="76" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="105" y="31" text-anchor="middle" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#0f172a">FCaptureJob[i]</text>
    <text x="105" y="57" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#475569">位置 · 旋转 · 投影参数</text>
  </g>
  <path d="M342 246H430" stroke="#475569" stroke-width="4" marker-end="url(#arrowSlate)"/>
  <g transform="translate(450 198)">
    <rect width="490" height="96" rx="14" fill="url(#blueCard)" stroke="#60a5fa" stroke-width="2"/>
    <rect x="22" y="24" width="66" height="46" rx="7" fill="#2563eb"/>
    <circle cx="55" cy="47" r="14" fill="#bfdbfe" stroke="#ffffff" stroke-width="3"/>
    <path d="M88 33L116 20V74L88 61Z" fill="#60a5fa"/>
    <text x="144" y="34" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1e40af">SceneCaptureComponent2D</text>
    <text x="144" y="61" font-family="Consolas, monospace" font-size="14" fill="#334155">SetWorldLocationAndRotation(...)</text>
    <text x="144" y="82" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#475569">同一组件按 Job 逐次移动并重复采集</text>
  </g>
  <path d="M960 246H1048" stroke="#475569" stroke-width="4" marker-end="url(#arrowSlate)"/>
  <g transform="translate(1068 198)">
    <rect width="394" height="96" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="197" y="28" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#334155">选择投影方式</text>
    <rect x="20" y="44" width="164" height="34" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="210" y="44" width="164" height="34" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="102" y="66" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#1d4ed8">Perspective · FOV</text>
    <text x="292" y="66" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#6d28d9">Orthographic · Width</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="56" y="348" width="1488" height="386" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <circle cx="91" cy="385" r="18" fill="#0f172a"/>
  <text x="91" y="391" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#ffffff">2</text>
  <text x="122" y="392" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#0f172a">按顺序执行两次渲染，分别获得几何位置依据与表面颜色</text>

  <g transform="translate(92 428)">
    <rect width="190" height="254" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="95" y="31" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#334155">场景与相机</text>
    <path d="M24 198C54 157 80 188 102 127C120 78 148 134 169 169" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
    <rect x="26" y="74" width="42" height="30" rx="5" fill="#334155"/>
    <path d="M68 80L88 70V108L68 98Z" fill="#64748b"/>
    <path d="M90 89L147 134" stroke="#64748b" stroke-width="3" marker-end="url(#arrowSlate)"/>
    <path d="M89 72L169 108V205L89 104Z" fill="#94a3b8" fill-opacity=".08" stroke="#94a3b8" stroke-width="2"/>
    <text x="95" y="231" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#475569">同一视角</text>
  </g>

  <path d="M302 555H356" stroke="#475569" stroke-width="4" marker-end="url(#arrowSlate)"/>

  <g transform="translate(376 428)">
    <rect width="474" height="254" rx="16" fill="url(#blueCard)" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="34" cy="34" r="18" fill="#2563eb"/>
    <text x="34" y="40" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#ffffff">A</text>
    <text x="64" y="41" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">SceneDepth Pass</text>
    <text x="24" y="74" font-family="Consolas, monospace" font-size="14" fill="#334155">CaptureSource = SCS_SceneDepth</text>
    <rect x="24" y="94" width="154" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <path d="M42 154L61 128L81 145L104 111L128 138L160 102" fill="none" stroke="#2563eb" stroke-width="4"/>
    <text x="101" y="196" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#475569">Depth RenderTarget</text>
    <path d="M198 134H268" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <rect x="286" y="94" width="164" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <g fill="#3b82f6">
      <rect x="304" y="111" width="22" height="22" opacity=".25"/><rect x="330" y="111" width="22" height="22" opacity=".45"/><rect x="356" y="111" width="22" height="22" opacity=".70"/><rect x="382" y="111" width="22" height="22" opacity=".9"/><rect x="408" y="111" width="22" height="22"/>
      <rect x="304" y="137" width="22" height="22" opacity=".6"/><rect x="330" y="137" width="22" height="22" opacity=".8"/><rect x="356" y="137" width="22" height="22"/><rect x="382" y="137" width="22" height="22" opacity=".55"/><rect x="408" y="137" width="22" height="22" opacity=".3"/>
    </g>
    <text x="368" y="196" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#1d4ed8">DepthPixels</text>
    <text x="237" y="230" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#334155">用途：像素反投影、世界坐标重建、边缘检测</text>
  </g>

  <path d="M870 555H924" stroke="#475569" stroke-width="4" marker-end="url(#arrowSlate)"/>
  <text x="897" y="532" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#475569">完成后</text>

  <g transform="translate(944 428)">
    <rect width="526" height="254" rx="16" fill="url(#orangeCard)" stroke="#fb923c" stroke-width="2"/>
    <circle cx="34" cy="34" r="18" fill="#ea580c"/>
    <text x="34" y="40" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#ffffff">B</text>
    <text x="64" y="41" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#c2410c">BaseColor Pass</text>
    <text x="24" y="74" font-family="Consolas, monospace" font-size="14" fill="#334155">CaptureSource = SCS_BaseColor</text>
    <rect x="24" y="94" width="174" height="80" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <path d="M43 154C66 119 89 152 112 112C132 78 158 124 181 147" fill="none" stroke="#f97316" stroke-width="6"/>
    <circle cx="72" cy="129" r="9" fill="#22c55e"/><circle cx="117" cy="112" r="9" fill="#a16207"/><circle cx="160" cy="132" r="9" fill="#84cc16"/>
    <text x="111" y="196" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#475569">Color RenderTarget</text>
    <path d="M218 134H288" stroke="#ea580c" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <rect x="306" y="94" width="196" height="80" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <g>
      <rect x="325" y="111" width="28" height="22" fill="#65a30d"/><rect x="357" y="111" width="28" height="22" fill="#84cc16"/><rect x="389" y="111" width="28" height="22" fill="#a16207"/><rect x="421" y="111" width="28" height="22" fill="#78350f"/><rect x="453" y="111" width="28" height="22" fill="#f59e0b"/>
      <rect x="325" y="137" width="28" height="22" fill="#166534"/><rect x="357" y="137" width="28" height="22" fill="#4d7c0f"/><rect x="389" y="137" width="28" height="22" fill="#854d0e"/><rect x="421" y="137" width="28" height="22" fill="#92400e"/><rect x="453" y="137" width="28" height="22" fill="#d97706"/>
    </g>
    <text x="404" y="196" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#c2410c">ColorPixels</text>
    <text x="263" y="230" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#334155">用途：为重建后的采样点提供场景表面颜色</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="56" y="760" width="1488" height="264" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <circle cx="91" cy="797" r="18" fill="#0f172a"/>
  <text x="91" y="803" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#ffffff">3</text>
  <text x="122" y="804" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#0f172a">选择 GPU 读回策略，最终汇合为同一组 CPU 像素数据</text>

  <g transform="translate(92 840)">
    <rect width="560" height="140" rx="16" fill="url(#greenCard)" stroke="#34d399" stroke-width="2"/>
    <text x="24" y="31" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#047857">同步读回 · 调试路径</text>
    <rect x="24" y="51" width="132" height="44" rx="9" fill="#ffffff" stroke="#059669"/>
    <rect x="214" y="51" width="132" height="44" rx="9" fill="#ffffff" stroke="#059669"/>
    <rect x="404" y="51" width="132" height="44" rx="9" fill="#ffffff" stroke="#059669"/>
    <text x="90" y="78" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#065f46">CaptureScene</text>
    <text x="280" y="78" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#065f46">等待 GPU</text>
    <text x="470" y="78" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#065f46">立即读取</text>
    <path d="M166 73H204" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <path d="M356 73H394" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <text x="280" y="121" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#475569">简单直观，但 CPU 会等待 GPU，批量视图时容易阻塞编辑器</text>
  </g>

  <g transform="translate(680 840)">
    <rect width="606" height="140" rx="16" fill="url(#purpleCard)" stroke="#a78bfa" stroke-width="2"/>
    <text x="24" y="31" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#6d28d9">异步读回 · 批量路径</text>
    <rect x="24" y="51" width="126" height="44" rx="9" fill="#ffffff" stroke="#7c3aed"/>
    <rect x="178" y="51" width="126" height="44" rx="9" fill="#ffffff" stroke="#7c3aed"/>
    <rect x="332" y="51" width="104" height="44" rx="9" fill="#ffffff" stroke="#7c3aed"/>
    <rect x="464" y="51" width="118" height="44" rx="9" fill="#ffffff" stroke="#7c3aed"/>
    <text x="87" y="78" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#5b21b6">Submit Pass</text>
    <text x="241" y="78" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#5b21b6">GPU Readback</text>
    <text x="384" y="78" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#5b21b6">Tick 轮询</text>
    <text x="523" y="78" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#5b21b6">IsReady → 读取</text>
    <path d="M160 73H168" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <path d="M314 73H322" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <path d="M446 73H454" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <text x="303" y="121" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#475569">FRHIGPUTextureReadback 跨帧推进，避免一次调用长时间卡住</text>
  </g>

  <path d="M1298 910H1354" stroke="#475569" stroke-width="4" marker-end="url(#arrowSlate)"/>
  <g transform="translate(1372 838)">
    <rect width="138" height="144" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="69" y="31" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#0f172a">统一输出</text>
    <text x="69" y="64" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1d4ed8">DepthPixels</text>
    <text x="69" y="88" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#64748b">+</text>
    <text x="69" y="111" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#c2410c">ColorPixels</text>
    <text x="69" y="133" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#047857">→ 像素重建</text>
  </g>

  <text x="76" y="1066" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#475569">关键点：Depth 与 BaseColor 必须来自同一个 FCaptureJob 视角；异步模式仍保持 Depth → BaseColor 的阶段顺序。</text>
</svg>
