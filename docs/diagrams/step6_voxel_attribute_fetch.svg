<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172238" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#101827" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="hitTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="hitSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#be123c" stop-opacity="0.80"/>
      <stop offset="1" stop-color="#881337" stop-opacity="0.64"/>
    </linearGradient>
    <linearGradient id="swatch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.55" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#9a3412"/>
    </linearGradient>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4ade80"/>
    </marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#a78bfa"/>
    </marker>
    <style>
      .title { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-weight: 700; fill: #f8fafc; }
      .label { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-weight: 600; fill: #e2e8f0; }
      .body { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #94a3b8; }
      .mono { font-family: Consolas, "SFMono-Regular", monospace; fill: #cbd5e1; }
      .cyan { fill: #22d3ee; }
      .green { fill: #4ade80; }
      .red { fill: #fb7185; }
      .violet { fill: #a78bfa; }
      .amber { fill: #fbbf24; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <circle cx="1310" cy="100" r="230" fill="#0ea5e9" opacity="0.05"/>
  <circle cx="80" cy="850" r="260" fill="#8b5cf6" opacity="0.04"/>

  <text x="72" y="76" class="title" font-size="34">Step 6 · 体素属性读取：由命中 Cell 还原表面材质</text>
  <text x="72" y="111" class="body" font-size="17">DDA 已给出离散坐标；按整数地址精确读取体素记录，再用 Material ID 查询共享材质表</text>

  <rect x="62" y="148" width="672" height="590" rx="22" fill="url(#panel)" stroke="#334155" stroke-width="1.5"/>
  <rect x="762" y="148" width="616" height="590" rx="22" fill="url(#panel)" stroke="#334155" stroke-width="1.5"/>

  <circle cx="94" cy="188" r="14" fill="#22d3ee" opacity="0.16"/>
  <text x="94" y="194" class="label cyan" font-size="15" text-anchor="middle">1</text>
  <text x="120" y="195" class="title" font-size="22">命中坐标映射到体素记录</text>
  <text x="690" y="195" class="mono" font-size="14" text-anchor="end">Cell → Address</text>

  <g fill="none">
    <g stroke="#33465d" stroke-width="1.15" stroke-dasharray="7 6" opacity="0.58">
      <path d="M114 527 L294 591 L534 505"/>
      <path d="M114 467 L294 531 L534 445"/>
      <path d="M354 441 L174 377 M414 420 L234 356 M474 398 L294 334"/>
      <path d="M294 531 V411 M354 510 V390 M414 488 V368 M474 467 V347"/>
    </g>
    <g stroke="#53677f" stroke-width="1.25" opacity="0.86">
      <path d="M114 407 L294 471 L534 385 L354 321 Z"/>
      <path d="M114 527 V407 M294 591 V471 M534 505 V385"/>
      <path d="M174 548 V428 M234 570 V450 M354 570 V450 M414 548 V428 M474 527 V407"/>
    </g>
  </g>

  <g stroke="#fb7185" stroke-width="2.2">
    <polygon points="294,411 354,432 414,411 354,389" fill="url(#hitTop)"/>
    <polygon points="294,411 354,432 354,372 294,351" fill="url(#hitSide)"/>
    <polygon points="354,432 414,411 414,351 354,372" fill="#9f1239" opacity="0.78"/>
    <path d="M354 389 V329 M354 329 L414 351 M354 329 L294 351" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="7 6" opacity="0.65"/>
  </g>
  <circle cx="354" cy="390" r="8" fill="#4ade80" stroke="#dcfce7" stroke-width="2" filter="url(#glowGreen)"/>
  <text x="354" y="457" class="title" font-size="14" text-anchor="middle">HIT VOXEL</text>
  <text x="354" y="476" class="mono red" font-size="13" text-anchor="middle">cell = (3, 2, 1)</text>

  <rect x="102" y="228" width="288" height="74" rx="11" fill="#052e1a" stroke="#15803d"/>
  <text x="122" y="255" class="label green" font-size="15">来自 DDA 的离散结果</text>
  <text x="122" y="281" class="mono" font-size="14">HitCell = int3(3, 2, 1)</text>
  <path d="M278 303 L338 365" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <path d="M444 436 C500 454 518 497 546 532" fill="none" stroke="#22d3ee" stroke-width="2.4" marker-end="url(#arrowCyan)"/>
  <rect x="472" y="548" width="222" height="69" rx="11" fill="#082f49" stroke="#0e7490"/>
  <text x="583" y="575" class="label cyan" font-size="15" text-anchor="middle">整数寻址</text>
  <text x="583" y="599" class="mono" font-size="13" text-anchor="middle">index = 3 + 6·(2 + 5·1)</text>

  <g>
    <text x="104" y="630" class="label" font-size="16">Voxel Buffer</text>
    <text x="694" y="630" class="body" font-size="12" text-anchor="end">volumeSize = (6,5,4)</text>
    <rect x="102" y="648" width="592" height="66" rx="10" fill="#0f172a" stroke="#334155"/>
    <g font-size="12" text-anchor="middle">
      <rect x="118" y="661" width="68" height="39" rx="6" fill="#172033" stroke="#475569"/>
      <text x="152" y="677" class="mono">43</text><text x="152" y="693" class="body">empty</text>
      <rect x="194" y="661" width="68" height="39" rx="6" fill="#172033" stroke="#475569"/>
      <text x="228" y="677" class="mono">44</text><text x="228" y="693" class="body">empty</text>
      <rect x="270" y="655" width="112" height="51" rx="7" fill="#4c0519" stroke="#fb7185" stroke-width="2.5"/>
      <text x="326" y="676" class="mono red">45 · HIT</text><text x="326" y="695" class="mono">packedData</text>
      <rect x="390" y="661" width="68" height="39" rx="6" fill="#172033" stroke="#475569"/>
      <text x="424" y="677" class="mono">46</text><text x="424" y="693" class="body">empty</text>
      <rect x="466" y="661" width="68" height="39" rx="6" fill="#172033" stroke="#475569"/>
      <text x="500" y="677" class="mono">47</text><text x="500" y="693" class="body">empty</text>
      <rect x="542" y="661" width="136" height="39" rx="6" fill="#172033" stroke="#475569"/>
      <text x="610" y="684" class="mono">… contiguous …</text>
    </g>
  </g>

  <circle cx="794" cy="188" r="14" fill="#22d3ee" opacity="0.16"/>
  <text x="794" y="194" class="label cyan" font-size="15" text-anchor="middle">2</text>
  <text x="820" y="195" class="title" font-size="22">解包记录并查询材质表</text>
  <text x="1336" y="195" class="mono" font-size="14" text-anchor="end">Load → Decode → Lookup</text>

  <g>
    <rect x="800" y="228" width="173" height="82" rx="11" fill="#0f2538" stroke="#0e7490"/>
    <text x="886" y="255" class="label cyan" font-size="15" text-anchor="middle">精确读取</text>
    <text x="886" y="279" class="mono" font-size="13" text-anchor="middle">Voxel.Load(cell)</text>
    <text x="886" y="298" class="body" font-size="12" text-anchor="middle">整数坐标 · 无过滤</text>

    <path d="M981 269 H1020" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="1030" y="228" width="150" height="82" rx="11" fill="#32124d" stroke="#7c3aed"/>
    <text x="1105" y="255" class="label violet" font-size="15" text-anchor="middle">Packed Record</text>
    <text x="1105" y="279" class="mono" font-size="13" text-anchor="middle">uint data</text>
    <text x="1105" y="298" class="body" font-size="12" text-anchor="middle">占用 + ID + 局部属性</text>

    <path d="M1188 269 H1227" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowViolet)"/>

    <rect x="1237" y="228" width="105" height="82" rx="11" fill="#052e1a" stroke="#15803d"/>
    <text x="1289" y="255" class="label green" font-size="15" text-anchor="middle">Decode</text>
    <text x="1289" y="279" class="mono" font-size="12" text-anchor="middle">bits / mask</text>
    <text x="1289" y="298" class="body" font-size="12" text-anchor="middle">拆分字段</text>
  </g>

  <rect x="800" y="333" width="542" height="102" rx="11" fill="#0f172a" stroke="#334155"/>
  <text x="821" y="359" class="label" font-size="15">当前命中体素的局部字段</text>
  <g font-size="13">
    <rect x="821" y="375" width="112" height="42" rx="7" fill="#052e1a" stroke="#15803d"/>
    <text x="877" y="392" class="body" text-anchor="middle">occupied</text><text x="877" y="409" class="mono green" text-anchor="middle">1</text>
    <rect x="945" y="375" width="132" height="42" rx="7" fill="#32124d" stroke="#7c3aed"/>
    <text x="1011" y="392" class="body" text-anchor="middle">materialID</text><text x="1011" y="409" class="mono violet" text-anchor="middle">12</text>
    <rect x="1089" y="375" width="111" height="42" rx="7" fill="#172033" stroke="#475569"/>
    <text x="1144" y="392" class="body" text-anchor="middle">AO</text><text x="1144" y="409" class="mono" text-anchor="middle">0.78</text>
    <rect x="1212" y="375" width="110" height="42" rx="7" fill="#172033" stroke="#475569"/>
    <text x="1267" y="392" class="body" text-anchor="middle">flags</text><text x="1267" y="409" class="mono" text-anchor="middle">0x02</text>
  </g>

  <path d="M1011 435 V472" stroke="#a78bfa" stroke-width="2.4" marker-end="url(#arrowViolet)"/>
  <text x="1026" y="461" class="mono violet" font-size="12">Material[12]</text>

  <rect x="800" y="482" width="542" height="128" rx="12" fill="#16142b" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="822" y="510" class="label violet" font-size="16">共享 Material Table</text>
  <g>
    <rect x="822" y="527" width="68" height="62" rx="8" fill="url(#swatch)" stroke="#fdba74" stroke-width="2"/>
    <text x="856" y="603" class="mono amber" font-size="12" text-anchor="middle">BaseColor</text>
    <rect x="912" y="527" width="92" height="62" rx="8" fill="#172033" stroke="#475569"/>
    <text x="958" y="550" class="body" font-size="12" text-anchor="middle">Roughness</text>
    <text x="958" y="577" class="mono" font-size="17" text-anchor="middle">0.62</text>
    <rect x="1016" y="527" width="92" height="62" rx="8" fill="#172033" stroke="#475569"/>
    <text x="1062" y="550" class="body" font-size="12" text-anchor="middle">Metallic</text>
    <text x="1062" y="577" class="mono" font-size="17" text-anchor="middle">0.00</text>
    <rect x="1120" y="527" width="92" height="62" rx="8" fill="#172033" stroke="#475569"/>
    <text x="1166" y="550" class="body" font-size="12" text-anchor="middle">Emissive</text>
    <text x="1166" y="577" class="mono" font-size="17" text-anchor="middle">0.10</text>
    <rect x="1224" y="527" width="96" height="62" rx="8" fill="#172033" stroke="#475569"/>
    <text x="1272" y="550" class="body" font-size="12" text-anchor="middle">Opacity</text>
    <text x="1272" y="577" class="mono" font-size="17" text-anchor="middle">1.00</text>
  </g>

  <path d="M1071 610 V645" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <rect x="800" y="655" width="542" height="63" rx="11" fill="#052e1a" stroke="#15803d"/>
  <text x="821" y="681" class="label green" font-size="15">输出给着色阶段</text>
  <text x="821" y="703" class="mono" font-size="13">Surface = { BaseColor, Roughness, Metallic, Emissive, AO, Opacity }</text>

  <rect x="62" y="772" width="1316" height="82" rx="15" fill="#0c1628" stroke="#1e3a5f"/>
  <text x="88" y="803" class="label" font-size="16">读取原则</text>
  <g font-size="13">
    <rect x="190" y="788" width="330" height="48" rx="10" fill="#0f2538" stroke="#0e7490"/>
    <text x="355" y="808" class="mono cyan" text-anchor="middle">Load(int3 cell) · point access</text>
    <text x="355" y="827" class="body" text-anchor="middle">离散体素禁止线性过滤，避免属性串色</text>

    <rect x="539" y="788" width="353" height="48" rx="10" fill="#32124d" stroke="#7c3aed"/>
    <text x="715" y="808" class="mono violet" text-anchor="middle">Voxel record → Material ID</text>
    <text x="715" y="827" class="body" text-anchor="middle">体素仅保存紧凑索引，材质参数集中复用</text>

    <rect x="911" y="788" width="421" height="48" rx="10" fill="#19261d" stroke="#15803d"/>
    <text x="1121" y="808" class="mono green" text-anchor="middle">Attributes + Normal + Depth → Shading</text>
    <text x="1121" y="827" class="body" text-anchor="middle">与前两步结果汇合，进入最终光照与合成</text>
  </g>
</svg>
