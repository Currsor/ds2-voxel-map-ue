<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172238" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#101827" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cubeFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cubeSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#075985"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowAmber" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#fbbf24"/>
    </marker>
    <style>
      .title { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-weight: 700; fill: #f8fafc; }
      .label { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; font-weight: 600; fill: #e2e8f0; }
      .body { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #94a3b8; }
      .mono { font-family: Consolas, "SFMono-Regular", monospace; fill: #cbd5e1; }
      .cyan { fill: #22d3ee; }
      .amber { fill: #fbbf24; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <circle cx="1275" cy="100" r="220" fill="#0ea5e9" opacity="0.05"/>
  <circle cx="120" cy="820" r="250" fill="#8b5cf6" opacity="0.04"/>

  <text x="72" y="78" class="title" font-size="34">Step 1 · Billboard 框住 Block 的屏幕空间映射</text>
  <text x="72" y="112" class="body" font-size="17">先限定“哪些像素可能看见这个 Block”，再为选中像素生成一条具体射线</text>

  <rect x="62" y="150" width="630" height="600" rx="22" fill="url(#panel)" stroke="#334155" stroke-width="1.5"/>
  <rect x="748" y="150" width="630" height="600" rx="22" fill="url(#panel)" stroke="#334155" stroke-width="1.5"/>

  <circle cx="94" cy="190" r="14" fill="#22d3ee" opacity="0.16"/>
  <text x="90" y="196" class="label cyan" font-size="15" text-anchor="middle">1</text>
  <text x="120" y="197" class="title" font-size="22">世界空间</text>
  <text x="640" y="197" class="mono" font-size="14" text-anchor="end">World</text>

  <g transform="translate(120 392)">
    <path d="M0 0 L58 -34 L58 34 Z" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="-26" y="-22" width="34" height="44" rx="7" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="8" cy="0" r="8" fill="#22d3ee" filter="url(#glowCyan)"/>
    <path d="M-12 22 L-25 60 M-3 22 L10 60 M-32 60 L18 60" fill="none" stroke="#64748b" stroke-width="3"/>
  </g>
  <text x="104" y="488" class="label" font-size="16">Camera</text>
  <text x="104" y="511" class="mono" font-size="13">origin O</text>

  <path d="M186 382 L474 257 M186 402 L474 572" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.75"/>
  <path d="M186 392 L542 410" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrowAmber)" filter="url(#glowAmber)"/>
  <text x="310" y="374" class="label amber" font-size="15">具体射线 r(t)</text>

  <g>
    <path d="M452 308 L598 283 L620 550 L470 570 Z" fill="#22d3ee" opacity="0.06"/>
    <path d="M452 308 L598 283 L620 550 L470 570 Z" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="11 7"/>
    <circle cx="452" cy="308" r="5" fill="#22d3ee"/><circle cx="598" cy="283" r="5" fill="#22d3ee"/>
    <circle cx="620" cy="550" r="5" fill="#22d3ee"/><circle cx="470" cy="570" r="5" fill="#22d3ee"/>
    <text x="535" y="266" class="label cyan" font-size="17" text-anchor="middle">Billboard</text>
    <text x="535" y="592" class="body" font-size="14" text-anchor="middle">始终朝向 Camera</text>
  </g>

  <g>
    <polygon points="500,372 552,342 610,370 556,402" fill="url(#cubeTop)" stroke="#bae6fd" stroke-width="1.5"/>
    <polygon points="500,372 556,402 556,487 500,455" fill="url(#cubeFront)" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="556,402 610,370 610,454 556,487" fill="url(#cubeSide)" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="555" y="431" class="title" font-size="18" text-anchor="middle">Block</text>
  </g>

  <path d="M402 650 L470 568" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <rect x="136" y="627" width="280" height="70" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="156" y="654" class="body" font-size="14">Billboard 取 Block 8 个角点的投影包围</text>
  <text x="156" y="678" class="mono" font-size="14">B = bounds(project(corner₀…₇))</text>

  <path d="M706 450 L734 450" fill="none" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrowCyan)"/>
  <rect x="675" y="406" width="94" height="30" rx="15" fill="#083344" stroke="#155e75"/>
  <text x="722" y="427" class="label cyan" font-size="13" text-anchor="middle">投影</text>

  <circle cx="780" cy="190" r="14" fill="#22d3ee" opacity="0.16"/>
  <text x="780" y="196" class="label cyan" font-size="15" text-anchor="middle">2</text>
  <text x="806" y="197" class="title" font-size="22">屏幕空间</text>
  <text x="1328" y="197" class="mono" font-size="14" text-anchor="end">Screen / Pixel</text>

  <g>
    <rect x="825" y="244" width="476" height="360" rx="12" fill="#0a1220" stroke="#64748b" stroke-width="2"/>
    <g stroke="#1e293b" stroke-width="1">
      <path d="M865 244 V604 M905 244 V604 M945 244 V604 M985 244 V604 M1025 244 V604 M1065 244 V604 M1105 244 V604 M1145 244 V604 M1185 244 V604 M1225 244 V604 M1265 244 V604"/>
      <path d="M825 284 H1301 M825 324 H1301 M825 364 H1301 M825 404 H1301 M825 444 H1301 M825 484 H1301 M825 524 H1301 M825 564 H1301"/>
    </g>
    <text x="836" y="232" class="mono" font-size="13">(0, 0)</text>
    <text x="1301" y="626" class="mono" font-size="13" text-anchor="end">(width, height)</text>

    <rect x="948" y="306" width="230" height="230" rx="5" fill="#22d3ee" opacity="0.055"/>
    <rect x="948" y="306" width="230" height="230" rx="5" fill="none" stroke="#22d3ee" stroke-width="4"/>
    <path d="M948 291 V306 H933 M1178 291 V306 H1193 M948 551 V536 H933 M1178 551 V536 H1193" fill="none" stroke="#67e8f9" stroke-width="3"/>
    <text x="1063" y="286" class="label cyan" font-size="17" text-anchor="middle">Billboard 屏幕包围框</text>

    <polygon points="992,378 1053,343 1123,381 1060,419" fill="url(#cubeTop)" stroke="#bae6fd" stroke-width="1.5" opacity="0.95"/>
    <polygon points="992,378 1060,419 1060,491 992,450" fill="url(#cubeFront)" stroke="#38bdf8" stroke-width="1.5" opacity="0.95"/>
    <polygon points="1060,419 1123,381 1123,453 1060,491" fill="url(#cubeSide)" stroke="#0ea5e9" stroke-width="1.5" opacity="0.95"/>
    <text x="1060" y="438" class="title" font-size="18" text-anchor="middle">Block 投影</text>

    <rect x="1085" y="404" width="40" height="40" fill="#fbbf24" opacity="0.16" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="1105" cy="424" r="6" fill="#fbbf24" filter="url(#glowAmber)"/>
    <path d="M1105 424 L1245 355" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>
    <rect x="1198" y="318" width="130" height="42" rx="9" fill="#422006" stroke="#92400e"/>
    <text x="1263" y="344" class="label amber" font-size="14" text-anchor="middle">选中像素 p</text>
  </g>

  <g>
    <rect x="825" y="648" width="476" height="62" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="849" y="674" class="body" font-size="14">只对框内像素发射射线：</text>
    <text x="849" y="697" class="mono" font-size="14">p → NDC → inverse(ViewProjection) → r(t) = O + tD</text>
  </g>

  <rect x="62" y="786" width="1316" height="70" rx="15" fill="#0c1628" stroke="#1e3a5f"/>
  <circle cx="96" cy="821" r="9" fill="#22d3ee"/>
  <text x="120" y="817" class="label" font-size="16">核心关系</text>
  <text x="120" y="840" class="body" font-size="15">Billboard 是 Block 的屏幕空间粗包围；黄色像素 p 位于框内，因此进入下一步：让射线穿过 Billboard 平面片。</text>

  <g transform="translate(1200 808)">
    <rect width="18" height="18" fill="#22d3ee" opacity="0.12" stroke="#22d3ee" stroke-width="2"/>
    <text x="28" y="14" class="body" font-size="13">Billboard</text>
    <circle cx="112" cy="9" r="5" fill="#fbbf24"/>
    <text x="124" y="14" class="body" font-size="13">Ray / Pixel</text>
  </g>
</svg>